      # manual-review: re-attest whenever the hierarchical firewall policy 800000000001 (net-default) or VPC ingress rules widen; confirm management interfaces and administrative ports (SSH 22, HTTPS 443) remain restricted to internal networks, Panorama, and authorized Google Cloud IAP/Serverless VPC Access ranges
