# Central cloud-resource scoring assignment surface for trivy-plugin-vdr.
# SWB consumes this policy; trivy-plugin-vdr does not. Newly added types require deployment support.
# ServiceAccountKey resources remain distinct SCC targets but inherit their owning
# service account's complete CR/IR/AR profile unless an explicit key override applies.
# No broad key default: missing, ambiguous or unresolved owners must fail closed.
# CryptoKeys inherit SIP and multiAgency from their exact project/location/keyRing.
# Explicit key rules retain genuine exceptions; Class and reachability are not inherited.
apiVersion: vdr.fedramp.io/v1alpha1
kind: CloudResourceScoringConfig
defaults:
  # confidence: high | operator-confirmed FedRAMP High authorization for the Security Workbench Shared-Sec
  class: "D"
  # confidence: high | operator-confirmed multi-agency deployment; corroborated by five per-customer tenant-docs buckets (tenant-alpha, acme, fedramp-20x, tenant-beta, tenant-gamma)
  multiAgency: "true"
scopes:
  - provider: gcp
    project: acme-shared-sec-prod
    # confidence: high | operator-confirmed FedRAMP High (Class D) authorization
    class: "D"
    # confidence: high | operator-confirmed multi-agency Shared-Sec serving multiple tenant systems
    multiAgency: "true"
    nameRules:
      # confidence: medium | Host IPS Manager (tags function=trend-micro-deep-security-manager-server, information-impact-level=direct-impact-data); manages host IPS/anti-malware policy across the estate, so disclosure exposes restricted security evidence and corruption alters enforcement
      # manual-review: confirm HIDS agents continue enforcing local policy during a manager outage; if enforcement itself stops, AR:H protection-critical is confirmed rather than inferred
      # manual-review: verify whether HIDS holds agency-identifying host or event data that would make regulated-data a better CR reason than restricted-evidence
      - {type: compute.googleapis.com/Instance, match: hids, securityImpactProfile: restricted-evidence.security-enforcement.protection-critical}
      # confidence: medium | Infra Scanner Network Scanner scanner (tags function=infra-vuln-scanner-server, information-impact-level=direct-impact-data); holds unremediated vulnerability findings for the boundary; corruption of scan policy could suppress RA-5 findings
      # manual-review: confirm scan results retained on the scanner are limited to this boundary and do not aggregate tenant-system findings, which would support a higher AR
      # manual-review: verify whether a scanner outage breaches an RA-5 scan cadence commitment, which would raise AR to change-deferred or higher
      - {type: compute.googleapis.com/Instance, match: net-scanner, securityImpactProfile: restricted-evidence.security-enforcement.operations-support}
      # confidence: medium | DAST Scanner/Web Scanner web application scanner (tags function=web-dast-scanner-server, information-impact-level=direct-impact-data); holds web application vulnerability findings; corruption of scan configuration could suppress findings
      # manual-review: confirm stored scan credentials are bounded to scan targets and do not grant administrative access, which would support privileged-access for CR
      # manual-review: verify scan-result retention scope across tenant systems
      - {type: compute.googleapis.com/Instance, match: dast-scanner, securityImpactProfile: restricted-evidence.security-enforcement.operations-support}
      # confidence: medium | Security Workbench server (tags function=sec-workbench-server, information-impact-level=direct-impact-data); aggregates continuous-monitoring and POA&M evidence across tenant systems and is the delivered mission capability
      # manual-review: confirm SWB is the authoritative system of record for POA&M and ConMon findings rather than a presentation layer over another store; a presentation-only role would lower IR to record-keeping
      # manual-review: confirm whether SWB holds agency-attributable regulated data, which would make regulated-data the better CR reason
      - {type: compute.googleapis.com/Instance, match: swb, securityImpactProfile: restricted-evidence.authoritative-record.mission-essential}
      # confidence: medium | second Security Workbench server, identical tags and subnet (swb-subnet) to swb; classified by role, not replica count, per the HA rule
      # manual-review: confirm swb-2 serves the same tenant population as swb rather than a separate segregated tenant set
      # manual-review: AR is not lowered for the swb/swb-2 pair: redundancy is mitigation recorded outside the CR/IR/AR vector
      - {type: compute.googleapis.com/Instance, match: swb-2, securityImpactProfile: restricted-evidence.authoritative-record.mission-essential}
      # confidence: medium | GitLab server (tags function=gitlab-server, information-impact-level=direct-impact-data); holds IaC source and CI/CD variables with deployment authority over the estate; corruption alters what is released
      # manual-review: verify whether GitLab CI variables hold long-lived estate credentials rather than short-lived Workload Identity tokens; long-lived credentials would support root-secrets for CR
      # manual-review: confirm a GitLab outage only defers change (AR:M) and does not block an incident-response or recovery path, which would raise AR
      - {type: compute.googleapis.com/Instance, match: gitlab, securityImpactProfile: privileged-access.release-control.change-deferred}
      # confidence: medium | GitLab CI runner (tags function=gitlab-runner, information-impact-level=direct-impact-data) on gitlab-subnet; executes pipeline jobs with the deployment credentials the pipeline supplies, so it inherits release-control integrity
      # manual-review: confirm the runner's attached service account scope; broad cross-project deployment authority confirms privileged-access, a single-project scope would lower CR to scoped-access
      # manual-review: verify job isolation between tenant pipelines if the runner is shared
      - {type: compute.googleapis.com/Instance, match: gitlab-runner, securityImpactProfile: privileged-access.release-control.change-deferred}
      # confidence: medium | Cloud SQL backing store for SWB (tags function=sec-workbench-database, information-impact-level=direct-impact-data); persists the ConMon and POA&M record SWB serves
      # manual-review: confirm the database holds the authoritative record rather than a cache; inherits the same SWB authority question as the swb rule
      # manual-review: verify whether tenant-attributable regulated data is stored, which would make regulated-data the better CR reason
      - {type: sqladmin.googleapis.com/Instance, match: shared-sec-swb-pg-cloudsql, securityImpactProfile: restricted-evidence.authoritative-record.mission-essential}
      # confidence: medium | Cloud SQL backing store for swb-2, identical tags to shared-sec-swb-pg-cloudsql
      # manual-review: confirm whether this is an independent tenant dataset or a second instance of the same dataset; an independent tenant dataset does not change the vector but does change blast radius documentation
      # manual-review: verify regulated-data question as for shared-sec-swb-pg-cloudsql
      - {type: sqladmin.googleapis.com/Instance, match: shared-sec-swb-2-pg-cloudsql, securityImpactProfile: restricted-evidence.authoritative-record.mission-essential}
      # confidence: medium | Cloud SQL backing store for Trend Micro HIDS (tags function=trend-micro-deep-security-manager-database); persists host protection policy and security event history, so it inherits the HIDS enforcement dependency
      # manual-review: confirm the HIDS manager cannot serve policy or accept agent check-ins without this database; if agents fail open to cached policy the AR argument still holds, if the manager is unaffected AR drops to operations-support
      # manual-review: verify event retention scope against the HIDS CR reasoning
      - {type: sqladmin.googleapis.com/Instance, match: shared-sec-hids-pg-cloudsql, securityImpactProfile: restricted-evidence.authoritative-record.protection-critical}
      # confidence: medium | Cloud SQL backing store for GitLab (tags function=gitlab-database, information-impact-level=direct-impact-data); authoritative store of repository metadata, CI configuration, tokens and permissions
      # manual-review: verify whether CI variables and personal/group access tokens are stored here in recoverable form; that confirms privileged-access for CR
      # manual-review: confirm a database outage only defers change and does not block a recovery path
      - {type: sqladmin.googleapis.com/Instance, match: shared-sec-gitlab-pg-cloudsql, securityImpactProfile: privileged-access.authoritative-record.change-deferred}
      # builtin-pattern: gcp-cloudfunctions-staging
      # confidence: medium | matched builtin patterns gcp-cloudfunctions-staging and gcp-managed-by-label (label goog-managed-by=cloudfunctions); Cloud Functions auto-creates these buckets to stage function source archives, so the service owns naming and tenant tagging; covers gcf-v2-sources-100000000002-334040781 and gcf-v2-sources-100000000002-701000740
      # manual-review: attest CR down with a direct vector only after verifying the staged source archives embed no credentials or sensitive material
      # manual-review: confirm nothing re-consumes these artifacts after deployment; re-consumption would raise IR above disposable-state
      # manual-review: this rule is a pattern inference, not an operator attestation; re-review if a new gcf-v2-sources-* bucket appears with a different role
      - {type: storage.googleapis.com/Bucket, match: "gcf-v2-sources-*", securityImpactProfile: service-content.disposable-state.deferrable-work}
      # confidence: medium | tags function=cs-scan-results-storage, information-impact-level=direct-impact-data; stores scan output, which is restricted security evidence; treated as a non-authoritative record store because the scanners retain the source findings
      # manual-review: confirm the scanners retain source findings; if this bucket is the only retained copy, IR rises to authoritative-record
      # manual-review: verify whether scan results here span multiple tenant systems, which would strengthen the CR reasoning
      - {type: storage.googleapis.com/Bucket, match: acme-shared-sec-prod-cs-scan-results-bucket, securityImpactProfile: restricted-evidence.record-keeping.operations-support}
      # confidence: high | operator-attested: holds non-secret Ansible variables only, with secrets held in a secret manager; corruption alters the configuration applied to managed Shared-Sec hosts, so IR remains config-control
      - {type: storage.googleapis.com/Bucket, match: acme-shared-sec-prod-ansible-vars-bucket, securityImpactProfile: service-content.config-control.change-deferred}
      # confidence: high | operator-confirmed CR:M; tags function=gitlab-ci-artifacts-storage; holds CI build artifacts that feed deployment, so tampering is a release-integrity concern
      - {type: storage.googleapis.com/Bucket, match: acme-acme-shared-sec-prod-gitlab-cloud-build-artifact-bucket, securityImpactProfile: service-content.release-control.change-deferred}
      # confidence: high | operator-confirmed CR:M; tags function=gitlab-artifact-storage; GitLab artifact storage feeding deployment
      - {type: storage.googleapis.com/Bucket, match: acme-shared-sec-prod-gitlab-bucket, securityImpactProfile: service-content.release-control.change-deferred}
      # confidence: medium | tags function=installer-and-non-sensitive-configuration-artifact-storage, information-impact-level=low-and-limited-impact-data; the operator taxonomy attests non-sensitive contents, but installers consumed by host builds carry supply-chain integrity weight, so IR is held at release-control
      # manual-review: the operator low-and-limited-impact-data tag supports attesting CR down to public-content with a direct vector once contents are confirmed to be publicly redistributable installers
      # manual-review: confirm installers here are integrity-verified (checksum or signature) at consumption; unverified consumption confirms IR:H
      - {type: storage.googleapis.com/Bucket, match: acme-shared-sec-prod-artifact-bucket, securityImpactProfile: service-content.release-control.change-deferred}
      # confidence: medium | Terraform-provisioned (label goog-terraform-provisioned=true) Cloud Function source bucket; unlike the provider-managed gcf-v2-sources-* buckets this is tenant-named and tenant-owned, so it is classified on merit as a deploy-time source of record rather than under the disposable-artifact pattern
      # manual-review: confirm this bucket is the deployment source for the alert-router functions; if it is only a transient staging copy, IR drops to disposable-state and AR to deferrable-work
      # manual-review: verify the staged source embeds no credentials before attesting CR down
      - {type: storage.googleapis.com/Bucket, match: acme-shared-sec-prod-gcf-source, securityImpactProfile: service-content.release-control.change-deferred}
      # confidence: medium | untagged bucket named for the sec-workbench-relay-hids function; inferred to be that function's tenant-owned source or working store; classified on merit rather than under a builtin pattern because no pattern matched
      # manual-review: confirm the bucket's actual role: a function source store keeps this vector, a runtime event store would shift IR toward record-keeping and CR toward security-evidence
      # manual-review: bucket carries no labels; apply the operator function/information-impact-level taxonomy so future runs classify it from evidence rather than name inference
      - {type: storage.googleapis.com/Bucket, match: acme-sec-workbench-relay-hids, securityImpactProfile: service-content.release-control.change-deferred}
      # confidence: medium | Terraform-provisioned (label goog-terraform-provisioned=true) working store for the alert-router Cloud Run service; inferred to hold intermediate processing state for a bounded service
      # manual-review: confirm the workspace holds only transient intermediate state; durable monitoring or alert records would raise IR to record-keeping and CR to security-evidence
      # manual-review: bucket carries no function/information-impact-level label; apply the operator taxonomy
      - {type: storage.googleapis.com/Bucket, match: acme-shared-sec-prod-alert-router-workspace, securityImpactProfile: service-content.bounded-processing.bounded-service}
      # confidence: medium | Terraform-provisioned Cloud Run service behind external LB backend alert-router-lb-alert-router; monitoring/alerting application handling operational and security evidence in a bounded processing role
      # manual-review: confirm alert-router does not hold agency-attributable or regulated payload data, which would raise CR to regulated-data
      # manual-review: backend service alert-router-lb-alert-router carries no Cloud Armor security policy, unlike alert-router-lb-webhook; confirm this exposure is intended
      - {type: run.googleapis.com/Service, match: alert-router, securityImpactProfile: security-evidence.bounded-processing.operations-support}
      # confidence: high | operator-attested strict source-IP allowlist, corroborated read-only by gcloud run services describe (run.googleapis.com/ingress=internal-and-cloud-load-balancing) and gcloud compute security-policies describe webhook-filter-policy (two /32 allow rules, default deny(403)); the Cloud Armor policy is the component implementing the IP allowlist, not an L7/WAF ruleset
      # manual-review: re-attest whenever the webhook-filter-policy allowlist widens, whenever a source range broader than /32 is added, or whenever the sibling project's Cloud NAT egress addresses change
      # manual-review: the sibling project uses auto-allocated Cloud NAT addresses, which can change; confirm the two /32s are pinned to reserved static addresses or that a process updates the allowlist when they rotate
      # manual-review: this attestation displaces SWB's evidence-backed reachability verdict; a WAF or DDoS service alone would not justify it
      - {type: run.googleapis.com/Service, match: alert-router-webhook-filter, securityImpactProfile: security-evidence.bounded-processing.operations-support, internetReachable: "false", internetReachableJustification: "Cloud Run ingress is set to internal-and-cloud-load-balancing, so the run.app URLs accept no direct public traffic. The sole load-balancer path, backend service alert-router-lb-webhook (regional external managed LB alert-router-lb, us-east4), is governed by the regional Cloud Armor policy webhook-filter-policy, which admits exactly two source addresses at priority 1000 - 198.51.100.10/32 and 198.51.100.11/32, the operator-maintained Cloud NAT egress addresses of a sibling acme project inside the system authorization boundary - and denies every other source with a default deny(403) rule at priority 2147483647. No unrestricted public ingress path to this service exists."}
      # confidence: high | operator-attested AR:M (alert processing loss is deferrable, no detection gap). One rule intentionally left untyped so it covers both inventory records of this single logical component: the cloudfunctions.googleapis.com/Function and its gen2 run.googleapis.com/Service implementation (goog-managed-by=cloudfunctions, runtime python311). No other resource carries this identifier.
      - {match: alert-router-monitoring-alert-processor, securityImpactProfile: security-evidence.bounded-processing.operations-support}
      # confidence: high | operator-attested AR:M (HIDS event relay loss is deferrable, no detection gap). One rule intentionally left untyped so it covers both inventory records of this single logical component: the cloudfunctions.googleapis.com/Function and its gen2 run.googleapis.com/Service implementation (goog-managed-by=cloudfunctions, runtime dotnet8). No other resource carries this identifier; the similarly-named bucket acme-sec-workbench-relay-hids does not match this exact glob.
      - {match: sec-workbench-relay-hids, securityImpactProfile: security-evidence.bounded-processing.operations-support}
      # confidence: medium | Trusted VM/container release and recovery artifact; no source/image contents were read.
      # manual-review: Confirm artifact contents contain no embedded secrets and whether approved rebuild/alternate versions make loss only change-deferred.
      - {type: artifactregistry.googleapis.com/DockerImage, match: "projects/acme-shared-sec-prod/locations/us-east4/repositories/shared-sec-cloudsql-patcher-docker/dockerImages/*", securityImpactProfile: service-content.release-control.recovery-critical}
      # confidence: medium | Trusted VM/container release and recovery artifact; no source/image contents were read.
      # manual-review: Confirm artifact contents contain no embedded secrets and whether approved rebuild/alternate versions make loss only change-deferred.
      - {type: artifactregistry.googleapis.com/DockerImage, match: "projects/acme-shared-sec-prod/locations/us-east4/repositories/alert-router-registry/dockerImages/*", securityImpactProfile: service-content.release-control.recovery-critical}
      # confidence: medium | Trusted VM/container release and recovery artifact; no source/image contents were read.
      # manual-review: Confirm artifact contents contain no embedded secrets and whether approved rebuild/alternate versions make loss only change-deferred.
      - {type: artifactregistry.googleapis.com/DockerImage, match: "projects/acme-shared-sec-prod/locations/us-east4/repositories/sec-workbench-relay-hids/dockerImages/*", securityImpactProfile: service-content.release-control.recovery-critical}
      # confidence: medium | Trusted VM/container release and recovery artifact; no source/image contents were read.
      # manual-review: Confirm artifact contents contain no embedded secrets and whether approved rebuild/alternate versions make loss only change-deferred.
      - {type: artifactregistry.googleapis.com/Repository, match: projects/acme-shared-sec-prod/locations/us-east4/repositories/shared-sec-cloudsql-patcher-docker, securityImpactProfile: service-content.release-control.recovery-critical}
      # confidence: medium | Trusted VM/container release and recovery artifact; no source/image contents were read.
      # manual-review: Confirm artifact contents contain no embedded secrets and whether approved rebuild/alternate versions make loss only change-deferred.
      - {type: artifactregistry.googleapis.com/Repository, match: projects/acme-shared-sec-prod/locations/us-east4/repositories/alert-router-registry, securityImpactProfile: service-content.release-control.recovery-critical}
      # confidence: medium | Trusted VM/container release and recovery artifact; no source/image contents were read.
      # manual-review: Confirm artifact contents contain no embedded secrets and whether approved rebuild/alternate versions make loss only change-deferred.
      - {type: artifactregistry.googleapis.com/Repository, match: projects/acme-shared-sec-prod/locations/us-east4/repositories/sec-workbench-relay-hids, securityImpactProfile: service-content.release-control.recovery-critical}
      # confidence: medium | Security alert/automation processor.
      # manual-review: Confirm consumers, permission scope and consequence of complete logical loss; no payload was inspected.
      - {type: cloudfunctions.googleapis.com/Function, match: shared-sec-cloudsql-patcher, securityImpactProfile: security-evidence.bounded-processing.operations-support}
      # confidence: medium | Key-group profile moved from artifacts-key; CMEK metadata identifies 30 protected secret/bucket/SQL/PubSub consumers for that key. CryptoKeys inherit this SIP; no key material was retrieved.
      # manual-review: Verify all governed keys, additional disk/registry consumers, historical key versions and logical outage consequences; add narrow key exceptions for different requirements.
      # confidence: high | multiAgency retains the operator-confirmed project scope and is inherited by this ring's keys.
      - {type: cloudkms.googleapis.com/KeyRing, match: projects/acme-shared-sec-prod/locations/us-east4/keyRings/artifacts-keyring, securityImpactProfile: privileged-access.security-enforcement.operations-support, multiAgency: "true"}
      # confidence: medium | Key-group profile moved from documentation-key; CMEK metadata identifies 6 protected secret/bucket/SQL/PubSub consumers for that key. CryptoKeys inherit this SIP; no key material was retrieved.
      # manual-review: Verify all governed keys, additional disk/registry consumers, historical key versions and logical outage consequences; add narrow key exceptions for different requirements.
      # confidence: high | multiAgency retains the operator-confirmed project scope and is inherited by this ring's keys.
      - {type: cloudkms.googleapis.com/KeyRing, match: projects/acme-shared-sec-prod/locations/us-east4/keyRings/documentation-keyring, securityImpactProfile: privileged-access.security-enforcement.operations-support, multiAgency: "true"}
      # confidence: medium | Key-group profile moved from shared-sec-key; CMEK metadata identifies 75 protected secret/bucket/SQL/PubSub consumers for that key. CryptoKeys inherit this SIP; no key material was retrieved.
      # manual-review: Verify all governed keys, additional disk/registry consumers, historical key versions and logical outage consequences; add narrow key exceptions for different requirements.
      # confidence: high | multiAgency retains the operator-confirmed project scope and is inherited by this ring's keys.
      - {type: cloudkms.googleapis.com/KeyRing, match: projects/acme-shared-sec-prod/locations/us-east4/keyRings/shared-sec-keyring, securityImpactProfile: privileged-access.security-enforcement.mission-essential, multiAgency: "true"}
      # confidence: medium | Key-group profile moved from alert-router-registry-key; CMEK metadata identifies 2 protected secret/bucket/SQL/PubSub consumers for that key. CryptoKeys inherit this SIP; no key material was retrieved.
      # manual-review: Verify all governed keys, additional disk/registry consumers, historical key versions and logical outage consequences; add narrow key exceptions for different requirements.
      # confidence: high | multiAgency retains the operator-confirmed project scope and is inherited by this ring's keys.
      - {type: cloudkms.googleapis.com/KeyRing, match: projects/acme-shared-sec-prod/locations/us-east4/keyRings/alert-router-registry-keyring, securityImpactProfile: service-content.security-enforcement.mission-essential, multiAgency: "true"}
      # confidence: medium | Shared Shared-Sec security-workbench/control boundary.
      # manual-review: Confirm project-level complete logical loss consequence; bundled SCC IAM findings still need per-grant analysis.
      - {type: cloudresourcemanager.googleapis.com/Project, match: acme-shared-sec-prod, securityImpactProfile: restricted-evidence.foundation-control.mission-essential}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-dastweb-from-iap, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-hids-agent-egress, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-hids-egress-to-agents, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-hids-egress-to-update-server, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-hids-from-shared-sec, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-hids-from-iap, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-hids-from-tenants, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-hids-manager, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-egress-hids-psql, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-egress-gitlab-psql, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-egress-net-scanner-tenant-sql, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-egress-swb-2-psql, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-egress-swb-psql, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
      # manual-review: Confirm affected target population and whether complete enforcement loss is protection-critical; exposure and finding applicability remain separate.
      - {type: compute.googleapis.com/Firewall, match: allow-gitlab-ssh-egress, securityImpactProfile: control-metadata.security-enforcement.protection-critical}
      # confidence: medium | Network access enforcement control.
