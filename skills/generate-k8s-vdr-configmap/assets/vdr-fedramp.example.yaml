# Fictional example for a FedRAMP High, single-agency Kubernetes estate on The Armory.
# The compositional strings are exact decision traces resolved natively to
# independent CR/IR/AR security-impact profiles.
apiVersion: v1
kind: Namespace
metadata:
  name: fedramp-vdr-trivy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vdr-fedramp
  namespace: fedramp-vdr-trivy
data:
  # confidence: high | operator-confirmed FedRAMP High authorization (standard for The Armory)
  class: "D"
  # confidence: high | operator-confirmed single-agency deployment
  multiAgency: "false"

  scoring.yaml: |
    # Confirmed workload rules. Unknown future components stay fail-safe.
    nameRules:
      # confidence: high | cluster DNS role and shared dependency are structurally explicit
      - {namespace: kube-system, match: cluster-dns, securityImpactProfile: routing-metadata.foundation-control.shared-critical-path}
      # confidence: high | privileged node-network role establishes foundation authority
      - {namespace: kube-system, match: node-network-agent, securityImpactProfile: privileged-access.foundation-control.shared-critical-path}
      # confidence: high | privileged CSI node role is required for stateful recovery
      - {namespace: kube-system, match: "persistent-disk-node*", securityImpactProfile: privileged-access.foundation-control.recovery-critical}
      # confidence: medium | metrics-only content is inferred from the observed collector role
      # manual-review: verify the collector cannot ingest logs, traces, payload fragments, or credentials
      - {namespace: monitoring-system, match: "metrics-agent*", securityImpactProfile: ops-metadata.record-keeping.operations-support}
