# Operator-declared edges + attestation, captured during the agent-assisted review
# and merged with: capture_dataflow.py --merge operator-edges.yaml --emit all
# Format: references/configmap-schema.md ("operator-edges.yaml" section).
attestation:
  declaredTopologyComplete: true
  attestedBy: "platform-ops@agency.example.gov"
  date: "2026-07-01"
  note: "reviewed with platform team; db-backup and metrics-agent edges added manually"
edges:
  # zero-edge workload (image-baked config): answered in review
  - from: {namespace: webapp, kind: cronjob, name: db-backup}
    to: {namespace: webapp, service: postgres-rw, port: 5432, protocol: postgres}
    evidence: ["operator: backup job streams WAL from postgres-rw"]
  # narrow a pathless-base-URL hairpin fan-out to the backend actually called
  - from: {namespace: webapp, kind: deployment, name: worker}
    to: {namespace: webapp, service: auth-gateway, port: 9443, protocol: https}
    evidence: ["operator: worker only calls the SSO endpoint on the public host"]
    internetTransit: true
suppressEdges:
  # operator confirmed this base URL constructs links and does not initiate calls
  - from: {namespace: webapp, kind: deployment, name: worker}
    internetTransit: true
    reason: "reject conservative hairpin fan-out before adding the precise edge above"
resolveUnresolved:
  # host referenced in config that lives in a namespace outside the scan scope
  - host: search-index
    to: {namespace: search, service: elasticsearch, port: 9200}
  # confirmed external destination: stays in `unresolved` with the note attached
  - host: api.vendor-saas.example.com
    external: true
    note: "vendor SaaS, data leaves the cluster"
brokerCandidates:
  # possible payload path through a cloud broker; passed through verbatim so it
  # can be verified against IAM later (analysis-guide.md section 5)
  - broker: pubsub
    resource: "projects/agency-prod/topics/ingest"
    referencedBy:
      - workload: webapp/deployment/frontend
        serviceAccount: webapp/frontend
        identity: "principal://iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/agency-prod.svc.id.goog/subject/ns/webapp/sa/frontend"
        evidence: ["env:INGEST_TOPIC"]
      - workload: webapp/deployment/thumbnailer
        serviceAccount: webapp/thumbnailer
        identity: "principal://iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/agency-prod.svc.id.goog/subject/ns/webapp/sa/thumbnailer"
        evidence: ["env:INGEST_SUBSCRIPTION"]
    verify: "which principal holds roles/pubsub.publisher vs roles/pubsub.subscriber on topic ingest"
    status: unverified
    note: "frontend is internet-exposed; if thumbnailer subscribes it is payload-exposed"
